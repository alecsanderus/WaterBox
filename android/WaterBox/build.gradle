plugins {
     id 'com.android.application'
}


android {
    namespace = "org.GigaGames.WaterBox"
    compileSdkVersion 35
    ndkVersion = "28.2.13676358"
    defaultConfig {
        applicationId = "org.GigaGames.WaterBox"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            cmake {
                arguments "-DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON",
                        "-DANDROID_STL=c++_shared",
                        "-DANDROID_PLATFORM=android-21",
                        "-DSDL_SHARED=ON",
                        "-DSDL_STATIC=OFF"

                // abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    tasks.whenTaskAdded { task ->
        if (task.name.startsWith("merge") && task.name.endsWith("Assets")) {
            def variantName = task.name.substring("merge".length(), task.name.length() - "Assets".length())
            if (tasks.findByName("externalNativeBuild${variantName}")) {
                task.dependsOn("externalNativeBuild${variantName}")
            }
        }
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        sourceSets.main.assets.srcDirs = ['../../GameFiles']

        externalNativeBuild {

            cmake {
                path 'jni/CMakeLists.txt'
            }
        }

    }
    lint {
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
